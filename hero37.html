<title>University of Plymouth</title>
<style>
* {
	outline: 1px dotted red;
	outline-offset: -1px;
}
	


	
	
	.component {
  display: grid;
  position: relative;
  isolation: isolate;
  overflow: hidden;
}

.component > * {
  grid-area: 1 / 1;
}

.component > div:first-child {
  z-index: 0;
  min-width: 0;
}

.component > div:first-child::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 1;
  background-color: rgb(0 0 0 / 55%);
  pointer-events: none;
}

.component > div:first-child img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.component > div:nth-child(2) {
  position: relative;
  z-index: 2;
}
	
	
	
</style>
</head>

<main data-theme="turquoise">

</main>
