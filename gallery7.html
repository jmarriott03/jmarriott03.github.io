<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="description" content="Author: Jamie Marriott">
<meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">
<link rel="stylesheet" href="css2/plymouth_reset.css">
<link rel="stylesheet" href="css2/plymouth_framework.css">
<link rel="stylesheet" href="css2/plymouth_theme.css">
<title>University of Plymouth</title>
<style>
/*
* {
	outline: 1px dotted red;
	outline-offset: -1px;
}
*/
a {
	text-decoration: underline;
}
.card {
	position: relative;
}
.card-image-button {
	display: block;
	width: 100%;
	padding: 0;
	margin: 0;
	border: 0;
	background: transparent;
	font: inherit;
	text-align: left;
	text-decoration: none;
	cursor: zoom-in;
}
.card-image-button:focus {
	outline: 0;
}
.card-image-button:focus-visible {
outline: 3px solid #06c;
outline-offset: -3px;
}

/* Do not show a focus outline after opening with a mouse or trackpad. */
.card-image-button.is-pointer-opened:focus-visible {
outline: 0;
}
.card-image-wrapper {
	display: block;
}
.card-image {
	display: block;
	width: 100%;
	height: auto;
}
.gallery-dialog {
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	max-width: none;
	max-height: none;
	margin: 0;
	padding: 0;
	border: 0;
	border-radius: 0;
	background: var(--white);
	color: var(--black);
	overflow: hidden;
}
.gallery-dialog::backdrop {
background: rgba(0, 0, 0, 0.6);
}
.gallery-dialog-content {
	display: grid;
	grid-template-rows: auto minmax(0, 1fr) auto;
	height: 100vh;
	height: 100dvh;
	max-height: 100vh;
	max-height: 100dvh;
	overflow: hidden;
}
.gallery-dialog-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 1em;
	padding: 1em;
}
.gallery-dialog-title {
	margin: 0;
}
.gallery-dialog-close {
	flex: 0 0 auto;
	width: 1.5em;
	height: 1.5em;
	min-width: 24px;
	min-height: 24px;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	padding: 0;
	font-size: 1.5em;
	line-height: 1;
}
.gallery-dialog-close:focus-visible {
outline: 3px solid #06c;
outline-offset: 3px;
}

/* Suppress the close-button outline when the gallery was opened by pointer. */
.gallery-dialog.is-pointer-opened .gallery-dialog-close:focus-visible {
outline: 0;
}

/* Restore visible focus indicators when keyboard navigation begins. */
.gallery-dialog.is-keyboard-navigation .gallery-dialog-close:focus-visible {
outline: 3px solid #06c;
outline-offset: 3px;
}
.gallery-dialog-image-wrapper {
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 0;
	padding: 0 1em;
	background: var(--white);
}
.gallery-dialog-image {
	display: block;
	width: auto;
	max-width: 100%;
	height: auto;
	max-height: 100%;
	object-fit: contain;
	border-radius: 0;
}
.gallery-dialog-footer {
	display: grid;
	grid-template-columns: 1fr auto 1fr;
	align-items: center;
	gap: 1em;
	padding: 1em;
}
.gallery-dialog-position {
	margin: 0;
	text-align: center;
}
.gallery-dialog-previous {
	justify-self: start;
	width: 1.5em;
	height: 1.5em;
	min-width: 24px;
	min-height: 24px;
	font-size: 1.5em;
	line-height: 1;
}
.gallery-dialog-next {
	justify-self: end;
	width: 1.5em;
	height: 1.5em;
	min-width: 24px;
	min-height: 24px;
	font-size: 1.5em;
	line-height: 1;
}

@media (max-width: 40em) {
.gallery-dialog {
	width: 100vw;
	height: 100vh;
	height: 100dvh;
	max-width: none;
	max-height: none;
	margin: 0;
}
.gallery-dialog-content {
	height: 100vh;
	height: 100dvh;
	max-height: 100vh;
	max-height: 100dvh;
}
.gallery-dialog-image {
	max-height: 100%;
}
.gallery-dialog-footer {
	grid-template-columns: 1fr 1fr;
}
.gallery-dialog-position {
	grid-column: 1 / -1;
	grid-row: 1;
}
.gallery-dialog-previous {
	grid-column: 1;
	grid-row: 2;
}
.gallery-dialog-next {
	grid-column: 2;
	grid-row: 2;
}
}
.btn-neutral {
  background: var(--white);
  color: var(--black);
}
.btn-neutral:hover, .btn-neutral:focus-visible {
  background: var(--lgrey);
}
.gallery-dialog .btn:disabled,
.gallery-dialog .btn[aria-disabled="true"] {
  background-color: var(--white);
  color: var(--btn-disabled-txt);
  cursor: not-allowed;
  opacity: 1;
}
</style>
</head>

</main>
<dialog
id="gallery-dialog"
class="gallery-dialog rounded-1"
aria-labelledby="gallery-dialog-title">
  <div class="gallery-dialog-content">
    <div class="gallery-dialog-header">
      <h2 id="gallery-dialog-title" class="gallery-dialog-title">Student 1</h2>
      <form method="dialog">
        <button
type="submit"
class="gallery-dialog-close btn btn-neutral" aria-label="Close gallery"><span class="iconfont" aria-hidden="true">5</span></button>
      </form>
    </div>
    <div class="gallery-dialog-image-wrapper"><img
id="gallery-dialog-image"
class="gallery-dialog-image"
alt=""></div>
    <div class="gallery-dialog-footer">
      <button
type="button"
class="gallery-dialog-previous btn btn-neutral"><span class="iconfont" aria-hidden="true">P</span></button>
      <p
id="gallery-dialog-position"
class="gallery-dialog-position"
aria-live="polite"> Image 1 of 6 </p>
      <button
type="button"
class="gallery-dialog-next btn btn-neutral"><span class="iconfont" aria-hidden="true">N</span></button>
    </div>
  </div>

<script>
const galleryButtons = Array.from(
document.querySelectorAll('.card-image-button')
);

const dialog = document.querySelector('.gallery-dialog');
const dialogImage = document.querySelector('#gallery-dialog-image');
const dialogTitle = document.querySelector('#gallery-dialog-title');
const dialogPosition = document.querySelector('#gallery-dialog-position');
const previousButton = document.querySelector('.gallery-dialog-previous');
const nextButton = document.querySelector('.gallery-dialog-next');
const closeButton = document.querySelector('.gallery-dialog-close');

let currentIndex = 0;
let lastTrigger = null;
let openedByPointer = false;

/* Track keyboard navigation so focus indicators remain available to keyboard users. */
document.addEventListener('keydown', function (event) {
if (event.key === 'Tab' || event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
	openedByPointer = false;
	dialog.classList.remove('is-pointer-opened');
	dialog.classList.add('is-keyboard-navigation');

	galleryButtons.forEach(function (button) {
		button.classList.remove('is-pointer-opened');
	});
}
});

document.addEventListener('pointerdown', function () {
if (!dialog.open) {
	dialog.classList.remove('is-keyboard-navigation');
}
});

function updateGallery(index) {
currentIndex = index;

const button = galleryButtons[currentIndex];
const image = button.dataset.image;
const title = button.dataset.title;
const alt = button.dataset.alt;

dialogImage.src = image;
dialogImage.alt = alt;
dialogTitle.textContent = title;

dialogPosition.textContent =
'Image ' + (currentIndex + 1) + ' of ' + galleryButtons.length;

previousButton.disabled = currentIndex === 0;
nextButton.disabled = currentIndex === galleryButtons.length - 1;
}

function openGallery(index) {
lastTrigger = galleryButtons[index];

openedByPointer = false;

if (document.activeElement === lastTrigger) {
	openedByPointer = false;
}

updateGallery(index);

dialog.classList.remove('is-keyboard-navigation');
dialog.classList.remove('is-pointer-opened');
lastTrigger.classList.remove('is-pointer-opened');

/* Distinguish pointer activation from keyboard activation. */
if (window.matchMedia('(pointer: fine)').matches && !lastTrigger.matches(':focus-visible')) {
	openedByPointer = true;
	dialog.classList.add('is-pointer-opened');
	lastTrigger.classList.add('is-pointer-opened');
}

dialog.showModal();

closeButton.focus();
}

function closeGallery() {
if (dialog.open) {
dialog.close();
}
}

galleryButtons.forEach(function (button, index) {
button.addEventListener('click', function () {
openGallery(index);
});
});

previousButton.addEventListener('click', function () {
if (currentIndex > 0) {
updateGallery(currentIndex - 1);
}
});

nextButton.addEventListener('click', function () {
if (currentIndex < galleryButtons.length - 1) {
updateGallery(currentIndex + 1);
}
});

/* Use the left and right arrow keys to browse while the dialog is open. */
dialog.addEventListener('keydown', function (event) {
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) {
    return;
  }

  if (event.key === 'ArrowLeft') {
    event.preventDefault();

    if (currentIndex > 0) {
      updateGallery(currentIndex - 1);
    }
  }

  if (event.key === 'ArrowRight') {
    event.preventDefault();

    if (currentIndex < galleryButtons.length - 1) {
      updateGallery(currentIndex + 1);
    }
  }
});

dialog.addEventListener('close', function () {
dialogImage.removeAttribute('src');
dialogImage.alt = '';

if (lastTrigger) {
lastTrigger.focus();
}
});

dialog.addEventListener('click', function (event) {
if (event.target === dialog) {
closeGallery();
}
});
</script>
