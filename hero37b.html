<!doctype html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="description" content="Author: Jamie Marriott">
<meta name="viewport" content="width=device-width, minimum-scale=1, initial-scale=1">
<link rel="stylesheet" href="css2/plymouth_reset.css">
<link rel="stylesheet" href="css2/plymouth_framework.css">
<link rel="stylesheet" href="css2/plymouth_theme.css">
<title>University of Plymouth</title>
<style>
* {
	outline: 1px dotted red;
	outline-offset: -1px;
}
.overlay-tint {
	display: grid;
	position: relative;
	isolation: isolate;
	overflow: hidden;
}
.overlay-tint > * {
	grid-area: 1 / 1;
}
.overlay-tint > div:first-child {
	width: 100%;
	height: 100%;
}
.overlay-tint > div:first-child::after {
	content: "";
	position: absolute;
	inset: 0;
	background-color: rgb(0 0 0 / 55%);
	pointer-events: none;
}
.overlay-tint > div:nth-child(2) {
	position: relative;
	width: 100%;
}
</style>
</head>
<body>
<main>
  <div class="w-80 p-responsive">
    <h1>hero37b</h1>
  </div>
  <div class="overlay-tint centered-child">
    <div><img src="images/1280x720placeholder.gif" width="1280" height="720" alt="" class="img-cover"></div>
    <div class="w-80 grid gap-1 p-responsive">
      <div class="largetext white-text">
        <p><strong>A level results day</strong></p>
        <h2>Clearing 2026 is open</h2>
        <p><strong>Our phone and online Clearing services open from <span class="nowrap">8am to 9pm</span></strong></p>
      </div>
      <div>
        <div class="rounded-responsive mrfrosty p-responsive mb-reg w-fit-content">
          <h2><span class="iconfont" aria-hidden="true">0</span> Call our Clearing hotline <a href="#" class="nowrap">0333 241 6929</a> or</h2>
        </div>
        <div class="rounded-responsive mrfrosty p-responsive w-fit-content">
          <h2><a href="#"><span class="iconfont" aria-hidden="true">&#123;</span><strong> Apply through Clearing online</strong></a></h2>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
