<style>
:root {
--mb-module: 2em;
}
.card-list *:not(:focus):not(:focus-visible) {
	outline: 1px dotted red;
}
.card-list {
	list-style: none;
	padding: 0;
	margin: 0;
}
.card-list a {
	color: currentColor;
	text-decoration: underline;
	display: inline-block;
}
/* Added: card container positioning */
.card-list li {
	position: relative;
}
/* Added: stretch link to behave like full card */
.card-list li a::after {
	content: "";
	position: absolute;
	inset: 0;
}
.card-list li {
	margin-bottom: 0;
}
</style>
